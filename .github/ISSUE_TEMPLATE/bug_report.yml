name: Bug report
description: Report a reproducible qqmailctl problem without sharing secrets or private mail
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste an authorization code, complete email body, real attachment, or unredacted log. Use synthetic data only."
  - type: input
    id: version
    attributes:
      label: qqmailctl version
      placeholder: Output of qqmailctl version (not credentials)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic or redacted data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

